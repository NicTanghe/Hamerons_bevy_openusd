[package]
name = "usd_bevy"
version = "0.0.1"
edition = "2024"
license = "MIT"
description = "Live OpenUSD editor for Bevy: stage projection, change-driven sync, authoring, persistence."
repository = "https://github.com/bresilla/bevy_openusd"

[dependencies]
usd_macro = { path = "../usd_macro" }
openusd = { git = "https://github.com/mxpv/openusd", rev = "7934d9f3a375fabc93c14dc96b7900cbd035204d", features = ["geom", "shade", "skel", "lux", "physics", "media", "vol", "render", "proc", "ui"] }
glam = "0.30"
anyhow = "1"
log = "0.4"
bevy = { version = "0.19", default-features = false, features = [
    "std",
    "bevy_asset",
    "bevy_log",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_light",
    "bevy_mesh",
    "bevy_camera",
    "bevy_image",
    "reflect_auto_register",
] }
