[package]
name = "usd_bevy"
version = "0.0.1"
edition = "2024"
license = "MIT"
description = "Live OpenUSD editor for Bevy: stage projection, change-driven sync, authoring, persistence."
repository = "https://github.com/bresilla/bevy_openusd"

[dependencies]
usd_macro = { path = "../usd_macro" }
openusd = { git = "https://github.com/mxpv/openusd", features = ["geom", "shade", "skel", "lux", "physics", "media", "vol", "render", "proc", "ui"] }
glam = "0.30"
anyhow = "1"
log = "0.4"
ron = "0.12.1"
serde = { version = "1", features = ["derive"] }
# Keep this pinned revision in sync with the workspace root. Its WESL runtime
# is unconditional rather than gated by a `shader_format_wesl` feature.
bevy = { git = "https://github.com/bevyengine/bevy", rev = "7107093556e4069db8399760ba5151b719107c71", default-features = false, features = [
    "std",
    "bevy_asset",
    "bevy_log",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_light",
    "bevy_mesh",
    "bevy_camera",
    "bevy_image",
    "png",
    "jpeg",
    "reflect_auto_register",
] }

[build-dependencies]
ron = "0.12.1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
wesl = { version = "0.4.2", features = ["naga-ext"] }
