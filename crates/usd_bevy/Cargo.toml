[package]
name = "usd_bevy"
version = "0.0.1"
edition = "2024"
license = "MIT"
description = "Live OpenUSD editor for Bevy: stage projection, change-driven sync, authoring, persistence."
repository = "https://github.com/bresilla/bevy_openusd"

[dependencies]
openusd = { git = "https://github.com/mxpv/openusd", rev = "06d619d47ad0fb0d9174c376c41e9d339f4c3290", features = ["geom", "shade"] }
glam = "0.30"
anyhow = "1"
log = "0.4"
bevy = { version = "0.19", default-features = false, features = [
    "std",
    "bevy_asset",
    "bevy_log",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_light",
    "bevy_mesh",
    "bevy_camera",
    "bevy_image",
    "reflect_auto_register",
] }
