[workspace]
resolver = "2"
members = ["crates/usd_bevy"]
exclude = ["xtra"]

[package]
name = "usdview"
version = "0.0.1"
edition = "2024"
license = "MIT"
description = "Minimal live OpenUSD editor on Bevy."
repository = "https://github.com/bresilla/bevy_openusd"

[[bin]]
name = "usdview"
path = "src/main.rs"

[dependencies]
# The live USD editor: stage projection, sync, authoring, persistence.
usd_bevy = { path = "crates/usd_bevy" }
# Pure-Rust USD — the viewer opens the live `Stage` directly.
openusd = { git = "https://github.com/mxpv/openusd", rev = "06d619d47ad0fb0d9174c376c41e9d339f4c3290", features = ["geom", "shade"] }

# Bevy 0.19 (needs Rust 1.95+). Minimal viewport host: camera + light +
# gizmo grid + UsdPlugin + LiveStagePlugin.
bevy = { version = "0.19", default-features = false, features = [
    "std",
    "async_executor",
    "multi_threaded",
    "bevy_asset",
    "bevy_log",
    "bevy_window",
    "bevy_winit",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_light",
    "bevy_mesh",
    "bevy_camera",
    "bevy_image",
    "bevy_gizmos",
    "bevy_gizmos_render",
    "tonemapping_luts",
    "smaa_luts",
    "png",
    "ktx2",
    "zstd_rust",
    "x11",
    "wayland",
    "reflect_auto_register",
] }
