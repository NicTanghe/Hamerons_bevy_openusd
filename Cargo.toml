[workspace]
resolver = "2"
members = [
    "crates/usd_rapier",
    "crates/usd_bevy",
]
exclude = ["xtra"]

[package]
name = "usdview"
version = "0.0.1"
edition = "2024"
license = "MIT"
description = "Interactive viewer for OpenUSD scenes — built on bevy + the usd_bevy plugin."
repository = "https://github.com/bresilla/bevy_openusd"
build = "build.rs"

[[bin]]
name = "usdview"
path = "src/main.rs"

[dependencies]
# The Bevy USD plugin: asset loader, scene projection, marker
# components, Rapier physics adapter. Single dep brings in everything
# needed to load a USD into a Bevy app.
usd_bevy = { path = "crates/usd_bevy" }
usd_rapier = { path = "crates/usd_rapier" }
# Pure-Rust USD — the viewer reads camera projection and anim track
# data directly off the loaded `Stage` via openusd's typed views.
openusd = { git = "https://github.com/mxpv/openusd", rev = "06d619d47ad0fb0d9174c376c41e9d339f4c3290", features = ["geom", "lux", "media", "proc", "render", "shade", "skel", "ui", "physics"] }
# Direct Rapier dep for the viewer's static-ground collider authoring;
# `usd_bevy::physics::PhysicsWorld` exposes the Rapier sets we mutate.
rapier3d-f64 = "0.32"

# Bevy 0.19 (needs Rust 1.95+). The bin is a minimal viewport host for the
# live USD editor (camera/grid/lights + UsdPlugin + LiveStagePlugin + the
# first-party transform gizmo). The mara panel UI is re-added once mara is
# on Bevy 0.19.
bevy = { version = "0.19", default-features = false, features = [
    "std",
    "async_executor",
    "multi_threaded",
    "bevy_asset",
    "bevy_state",
    "bevy_log",
    "bevy_window",
    "bevy_winit",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_light",
    "bevy_mesh",
    "bevy_camera",
    "bevy_image",
    "bevy_scene",
    "bevy_gizmos",
    "bevy_gizmos_render",
    "bevy_post_process",
    "bevy_picking",
    "mesh_picking",
    "morph",
    "default_font",
    "tonemapping_luts",
    "smaa_luts",
    "png",
    "jpeg",
    "bmp",
    "tga",
    "hdr",
    "webp",
    "tiff",
    "ktx2",
    "zstd_rust",
    "x11",
    "wayland",
    "reflect_auto_register",
] }

anyhow = "1"

# `build.rs` bakes a sample USDZ (USDA + procedural PNG) into
# `assets/external/` so `cargo run -- usdz_sample.usdz` always has
# something real to show.
[build-dependencies]
zip = { version = "8", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
# Used by tests/project_usdz.rs to author a USDZ + verify embedded textures.
zip = { version = "8", default-features = false, features = ["deflate"] }
image = "0.25"
