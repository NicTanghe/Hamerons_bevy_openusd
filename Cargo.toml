[workspace]
resolver = "2"
members = ["crates/usd_bevy", "crates/usd_macro"]
exclude = ["xtra", "vendor/materialx-wesl/tools"]

[package]
name = "usdview"
version = "0.0.1"
edition = "2024"
license = "MIT"
description = "Live OpenUSD editor — mara UI host embedding a Bevy viewport."
repository = "https://github.com/bresilla/bevy_openusd"

[[bin]]
name = "usdview"
path = "src/main.rs"

[dependencies]
# The live USD editor: stage projection, sync, authoring, persistence.
usd_bevy = { path = "crates/usd_bevy" }
# Pure-Rust USD — the viewer opens the live `Stage` directly.
openusd = { git = "https://github.com/mxpv/openusd", features = ["geom", "shade"] }

# mara — the egui UI host (window + ribbons/panes) embedding a Bevy viewport.
mara = { path = "../mara/mara", default-features = false, features = ["window", "bevy"] }
# Native "Open USD…" file picker.
rfd = "0.15"
# Detailed, filterable tracing to stderr (the embedded Bevy app has no
# LogPlugin, so without this the app's logs go nowhere).
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Pin Bevy main: MaterialX shaders use its WESL runtime. WESL support is
# unconditional on this revision; keep the revision in sync with
# `crates/usd_bevy/Cargo.toml`.
bevy = { git = "https://github.com/bevyengine/bevy", rev = "7107093556e4069db8399760ba5151b719107c71", default-features = false, features = [
    "std",
    "bevy_asset",
    "bevy_log",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_light",
    "bevy_mesh",
    "bevy_camera",
    "bevy_image",
    "png",
    "jpeg",
    "reflect_auto_register",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "0.36.1", default-features = false, features = ["default_fonts", "wgpu", "x11"] }
wgpu = { version = "30", default-features = false, features = ["vulkan"] }
egui-wgpu = { version = "0.36.1", default-features = false, features = ["winit"] }
